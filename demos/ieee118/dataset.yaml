name: ieee118
version: 1.0.0
title: IEEE 118-bus DC optimal power flow (DC-OPF) blackout model
license: CC-BY-4.0
description: >
  IEEE 118-bus DC-OPF blackout model from Chan et al. (2024).
  The system has 118 buses, 186 branches, and 54 generators — 304 failable
  components in total. Each bus is represented as a virtual edge `vbusX`
  connecting `busX` to `busX_int`, so bus failure is modelled as edge failure.
  Component state definitions:
    - 54 generator buses (4 states): 0=complete removal (p=0.01),
      1=40% capacity (p=0.19), 2=80% capacity (p=0.30), 3=full capacity (p=0.50).
    - 64 ordinary buses (2 states): 0=failed (p=0.01), 1=operational (p=0.99).
    - 186 branches (2 states): 0=failed (p=0.01), 1=operational (p=0.99).
  Blackout threshold is 13.8% (Scenario 1 in the reference).

